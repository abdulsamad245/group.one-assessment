name: Laravel Setup

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  setup:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password
      APP_KEY: ${{ secrets.APP_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, mysql, pdo_mysql
          ini-values: post_max_size=256M, memory_limit=2G

      - name: Install Dependencies
        run: |
          curl -sS https://getcomposer.org/installer | php -- --version=2.7.6
          sudo mv composer.phar /usr/local/bin/composer
          composer install --no-interaction --prefer-dist

      - name: Copy .env and set APP_KEY
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          echo "APP_KEY=${{ secrets.APP_KEY }}" >> .env

      - name: Start Sail
        run: ./vendor/bin/sail up -d

      - name: Wait for MySQL
        run: |
          until ./vendor/bin/sail exec -T mysql mysqladmin ping -h"mysql" --silent; do
            echo "Waiting for database..."
            sleep 5
          done

      - name: Set Up Database
        run: ./vendor/bin/sail artisan migrate --seed --force
