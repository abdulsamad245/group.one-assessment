name: CI/CD Pipeline

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  laravel-ci:
    runs-on: ubuntu-latest

    # MySQL service for tests
    services:
      mysql:
        image: mysql/mysql-server:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
          MYSQL_USER: root
          MYSQL_PASSWORD: password
        ports:
          - 3307:3306
        options: |-
          --health-cmd="mysqladmin ping -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      # 1. Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, mysql, pdo_mysql
          ini-values: post_max_size=256M, memory_limit=2G

      # 3. Install composer dependencies
      - name: Install Dependencies
        run: |
          curl -sS https://getcomposer.org/installer | php -- --version=2.7.6
          sudo mv composer.phar /usr/local/bin/composer
          composer install --no-interaction --prefer-dist

      # 4. Copy .env and generate APP_KEY
      - name: Copy .env & Generate APP_KEY
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan key:generate --ansi

      # 5. Start Laravel Sail
      - name: Start Sail
        run: ./vendor/bin/sail up -d

      # 6. Wait for MySQL to be ready
      - name: Wait for MySQL
        run: |
          until ./vendor/bin/sail exec -T mysql mysqladmin ping -h"mysql" --silent; do
            echo "Waiting for database..."
            sleep 5
          done

      # 7. Run migrations & seeders
      - name: Set Up Database
        run: ./vendor/bin/sail artisan migrate --seed --force

      # 8. Validate Pull Request Description (manual validation)
      - name: Validate Pull Request Description
        uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        with:
          script: |
            const description = context.payload.pull_request.body;
            if (!description || description.length < 20) {
              throw new Error("PR description is too short or empty. Please provide a detailed description.");
            }

      # 9. Run unit & integration tests
      - name: Execute Tests
        run: ./vendor/bin/sail test

      # 10. Generate code coverage report
      - name: Generate Coverage Report
        run: ./vendor/bin/sail php vendor/bin/phpunit --coverage-clover=tests/report/coverage.xml

      # 11. Run diff coverage (fail if under 50%)
      - name: Run Diff Coverage
        run: |
          diff-cover tests/report/coverage.xml --compare-branch=origin/develop --fail-under=50

      # 12. Run code quality checks
      - name: Run Linting & Static Analysis
        run: |
          composer lint        # Pint / formatting
          composer phpstan     # PHPStan
          composer phpcs       # PHPCS / coding standards

      # 13. Upload coverage to Codacy (optional)
      - name: Upload Coverage to Codacy
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: tests/report/coverage.xml

      # 14. Post diff coverage report to PR (optional)
      - name: Post Diff Coverage to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('diff-cover-report.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment,
            })
